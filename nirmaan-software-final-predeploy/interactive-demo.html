th:96px;height:72px;object-fit:cover;border-radius:9px}.remove-photo{position:absolute;right:-5px;top:-5px;width:24px;height:24px;border:0;border-radius:50%;background:#17201c;color:white;cursor:pointer}.capability{padding:9px 11px;border-radius:9px;background:#fff8e9;color:#7a5114;font-size:12px}@media(max-width:650px){.media-actions{grid-template-columns:repeat(2,1fr)}}@media(max-width:800px){.shell{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line)}.grid{grid-template-columns:1fr}.content{padding:16px}.photos{grid-template-columns:repeat(2,1fr)}.user>span{display:none}}

</style></head><body><header class="top"><div class="brand"><span class="mark">N</span>Nirmaan <span style="font-weight:400;opacity:.6">TotalWorks</span></div><div class="user"><span id="userName">Lavish Gupta</span><select id="role" class="role-switch"><option value="boss">Boss / Admin</option><option value="project_manager">Project Manager</option><option value="architect">Architect</option><option value="contractor">Contractor</option><option value="client">Client</option></select><button class="btn" id="reset">Reset demo</button></div></header><div class="shell"><aside><div class="sidehead"><b>Projects</b><button class="btn primary" id="newProject">+</button></div><div id="projects"></div></aside><main class="content" id="main"></main></div><div id="modalRoot"></div><div id="toastRoot"></div>
<script>
const K='nirmaan-demo-v5'; const seed={projects:[{id:1,code:'A',name:'Green Valley Residence',location:'Dehradun, Uttarakhand',status:'on track',budget:12500000,spent:5100000,progress:42,team:[{id:'TW-PM-2041',name:'Aarav Mehta',role:'Project Manager'},{id:'TW-AR-4420',name:'Riya Kapoor',role:'Architect'},{id:'TW-TK-8302',name:'Mohan Singh',role:'Contractor'},{id:'TW-CL-1108',name:'Ananya Sharma',role:'Client'}],tasks:[{id:1,title:'Ground floor slab',assignee:'Mohan Singh',status:'done',progress:100},{id:2,title:'First floor brickwork',assignee:'Mohan Singh',status:'in progress',progress:65},{id:3,title:'Electrical conduit layout',assignee:'Aarav Mehta',status:'pending',progress:10}],updates:[{id:1,title:'Ground floor slab completed',description:'Concrete pour completed and curing started. Site is progressing on schedule.',progress:42,author:'Mohan Singh',date:'Today, 4:20 PM',transcript:'Slab work is complete. We have started curing and the team will begin first-floor brickwork next.',photos:[]}],messages:[{name:'Ananya Sharma',role:'Client',text:'Looks good. Please share the front elevation photos after brickwork starts.'}]},{id:2,code:'B',name:'Orchard Office Fit-out',location:'Rajpur Road, Dehradun',status:'on track',budget:4800000,spent:1800000,progress:37,team:[{id:'TW-PM-2041',name:'Aarav Mehta',role:'Project Manager'},{id:'TW-AR-4420',name:'Riya Kapoor',role:'Architect'}],tasks:[{id:4,title:'Ceiling grid',assignee:'Aarav Mehta',status:'in progress',progress:55}],updates:[],messages:[]}],current:1};
const projectsEl=document.getElementById('projects'),mainEl=document.getElementById('main'),modalRoot=document.getElementById('modalRoot'),toastRoot=document.getElementById('toastRoot'),newProjectBtn=document.getElementById('newProject'),resetBtn=document.getElementById('reset');
let db=load(); let currentRole='boss'; let recorder=null,stream=null,chunks=[],recordedBlob=null,recognition=null;
function stopMedia(){try{if(recorder&&recorder.state==='recording')recorder.stop()}catch(e){}try{stream?.getTracks().forEach(t=>t.stop())}catch(e){}stream=null;try{recognition?.stop()}catch(e){}recognition=null}
function load(){try{return JSON.parse(localStorage.getItem(K))||structuredClone(seed)}catch(e){return structuredClone(seed)}} function save(){try{localStorage.setItem(K,JSON.stringify(db));return true}catch(e){toast('Browser storage is full. Remove large media or reset the demo.');return false}} function p(){return db.projects.find(x=>x.id===db.current)||db.projects[0]}
function money(n){return '₹'+Number(n).toLocaleString('en-IN')} function toast(s){const x=document.createElement('div');x.className='toast';x.textContent=s;toastRoot.append(x);setTimeout(()=>x.remove(),2600)} function canManage(){return ['boss','project_manager'].includes(currentRole)} function canPost(){return ['boss','project_manager','contractor'].includes(currentRole)}
function renderProjects(){projectsEl.innerHTML='';db.projects.forEach(x=>{let b=document.createElement('button');b.className='project '+(x.id===db.current?'active':'');b.innerHTML=`<b>Site ${x.code} · ${esc(x.name)}</b><small>${esc(x.location)} · ${x.progress}% complete</small>`;b.onclick=()=>{db.current=x.id;save();render()};projectsEl.append(b)});newProjectBtn.style.display=currentRole==='boss'?'':'none'}
function render(){renderProjects();const x=p(); if(!x){mainEl.innerHTML='<div class="empty">No projects.</div>';return} mainEl.innerHTML=`<div class="hero"><div><div class="eyebrow">SITE ${esc(x.code)}</div><h1>${esc(x.name)}</h1><div class="muted">${esc(x.location)}</div></div><span class="pill">${esc(x.status)}</span></div><div class="grid"><div class="stat"><span class="muted">Overall progress</span><strong>${x.progress}%</strong><div class="progress"><span style="width:${x.progress}%"></span></div></div><div class="stat"><span class="muted">Budget</span><strong>${money(x.budget)}</strong><small class="muted">Spent ${money(x.spent)}</small></div><div class="stat"><span class="muted">Open tasks</span><strong>${x.tasks.filter(t=>t.status!=='done').length}</strong><small class="muted">${x.tasks.length} total tasks</small></div></div>${teamHTML(x)}${tasksHTML(x)}${updatesHTML(x)}${feedbackHTML(x)}`;wire(x)}
function teamHTML(x){return `<section class="panel"><div class="panelhead"><h2>Team</h2>${canManage()?'<button class="btn" id="grant">Grant access</button>':''}</div>${x.team.map(u=>`<div class="team"><div class="who"><span class="avatar">${esc(u.name[0])}</span><div><b>${esc(u.name)}</b><div class="muted">${esc(u.role)} · ${esc(u.id)}</div></div></div></div>`).join('')}</section>`}
function tasksHTML(x){const editable=canManage()||currentRole==='contractor';return `<section class="panel"><div class="panelhead"><h2>Tasks</h2>${canManage()?'<button class="btn primary" id="addTask">+ New task</button>':''}</div>${x.tasks.length?x.tasks.map(t=>{const contractorCan=currentRole==='contractor'&&t.assignee==='Mohan Singh';const canEdit=canManage()||contractorCan;return `<div class="task" data-task="${t.id}"><div class="task-main"><h3>${esc(t.title)}</h3><div class="muted">${esc(t.assignee)}</div><div class="progress" aria-label="${t.progress}% complete"><span style="width:${t.progress}%"></span></div></div>${canEdit?`<select class="taskStatus" aria-label="Task status"><option ${t.status==='pending'?'selected':''}>pending</option><option ${t.status==='in progress'?'selected':''}>in progress</option><option ${t.status==='delayed'?'selected':''}>delayed</option><option ${t.status==='done'?'selected':''}>done</option></select><input class="taskProgress" aria-label="Task progress percent" type="number" min="0" max="100" value="${t.progress}" style="width:78px">`:`<div class="task-readonly"><b>${t.progress}%</b><div class="muted">${esc(t.status)}</div></div>`}</div>`}).join(''):'<div class="empty">No tasks yet.</div>'}${currentRole==='contractor'?'<div class="permission-note">Contractors can update tasks assigned to them.</div>':''}</section>`}
function updatesHTML(x){const actions=canPost()?`<div class="quick-actions" aria-label="Site update tools"><button class="btn" id="quickUpload">📷 Upload photos</button><button class="btn" id="quickCamera">📸 Open camera</button><button class="btn" id="quickVoice">🎙️ Record voice note</button><button class="btn" id="quickSpeech">🗣️ Live speech-to-text</button></div>`:`<div class="permission-note">You can view site evidence and transcripts. Boss/Admin, Project Managers and Contractors can post new site updates.</div>`;return `<section class="panel" id="siteUpdates"><div class="panelhead"><div><h2>Site updates</h2><div class="muted">Photos, live camera capture, voice notes and speech-to-text transcripts.</div></div>${canPost()?'<button class="btn primary" id="postUpdate">+ Post site update</button>':''}</div>${actions}<div class="feed">${x.updates.length?x.updates.map((u,ui)=>`<article class="update"><div class="updatehead"><div><h3>${esc(u.title)}</h3><div class="muted">${esc(u.author)} · ${esc(u.date)}</div></div><b>${u.progress??x.progress}%</b></div><p>${esc(u.description||'')}</p>${u.photos?.length?`<div class="photos">${u.photos.map((src,i)=>`<button class="photo" data-ui="${ui}" data-pi="${i}" aria-label="Open site photo ${i+1} of ${u.photos.length}"><img src="${src}" alt="Site update photo ${i+1}"></button>`).join('')}</div>`:''}${u.audio?`<div class="voice"><audio controls preload="metadata" src="${u.audio}"></audio>${u.transcript?`<p class="transcript"><b>Transcript:</b> ${esc(u.transcript)}</p>`:''}</div>`:u.transcript?`<div class="voice"><p class="transcript"><b>Transcript:</b> ${esc(u.transcript)}</p></div>`:''}</article>`).join(''):'<div class="empty">No site updates posted yet.</div>'}</div></section>`}
function feedbackHTML(x){return `<section class="panel"><div class="panelhead"><h2>Feedback</h2></div><div>${x.messages.length?x.messages.map(m=>`<div class="message"><div><b>${esc(m.name)}</b> <span class="badge">${esc(m.role)}</span><div>${esc(m.text)}</div></div></div>`).join(''):'<div class="muted">No feedback yet.</div>'}</div><div class="feedback"><textarea id="feedbackText" rows="2" placeholder="Share an update, question, or feedback..."></textarea><button class="btn primary" id="sendFeedback">Post</button></div></section>`}
function wire(x){document.querySelectorAll('.taskStatus').forEach(s=>s.onchange=e=>{const t=x.tasks.find(t=>t.id==e.target.closest('.task').dataset.task);t.status=s.value;if(s.value==='done')t.progress=100;else if(t.progress===100)t.progress=95;save();render();toast('Task updated')});document.querySelectorAll('.taskProgress').forEach(i=>i.onchange=e=>{const t=x.tasks.find(t=>t.id==e.target.closest('.task').dataset.task);t.progress=Math.max(0,Math.min(100,Number.isFinite(+i.value)?+i.value:0));if(t.progress===100)t.status='done';else if(t.status==='done')t.status='in progress';save();render();toast('Progress updated')});document.querySelectorAll('.photo').forEach(b=>b.onclick=()=>lightbox(x.updates[+b.dataset.ui].photos,+b.dataset.pi));const g=document.getElementById('grant');if(g)g.onclick=()=>grantModal(x);const a=document.getElementById('addTask');if(a)a.onclick=()=>taskModal(x);const u=document.getElementById('postUpdate');if(u)u.onclick=()=>updateModal(x);const qu=document.getElementById('quickUpload');if(qu)qu.onclick=()=>updateModal(x,'upload');const qc=document.getElementById('quickCamera');if(qc)qc.onclick=()=>updateModal(x,'camera');const qv=document.getElementById('quickVoice');if(qv)qv.onclick=()=>updateModal(x,'voice');const qs=document.getElementById('quickSpeech');if(qs)qs.onclick=()=>updateModal(x,'speech');const sf=document.getElementById('sendFeedback'),ft=document.getElementById('feedbackText');if(sf&&ft)sf.onclick=()=>{const v=ft.value.trim();if(!v)return toast('Write feedback before posting');if(v.length>1000)return toast('Feedback is limited to 1000 characters'); x.messages.push({name:currentRole==='client'?'Ananya Sharma':'Lavish Gupta',role:labelRole(currentRole),text:v});save();render();toast('Feedback posted')}}
function modal(title,body,onOpen){modalRoot.innerHTML=`<div class="modalbg" id="mb" role="presentation"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modalhead"><h2 id="modalTitle">${esc(title)}</h2><button class="btn" id="mx" aria-label="Close dialog">×</button></div>${body}</div></div>`;const bg=document.getElementById('mb'),closeBtn=document.getElementById('mx');let closed=false;const key=e=>{if(e.key==='Escape'){e.preventDefault();close()}if(e.key==='Tab'){const f=[...modalRoot.querySelectorAll('button:not([disabled]),input:not([disabled]),textarea:not([disabled]),select:not([disabled]),audio[controls]')].filter(el=>el.offsetParent!==null);if(!f.length)return;const first=f[0],last=f[f.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}};const close=()=>{if(closed)return;closed=true;document.removeEventListener('keydown',key);stopMedia();modalRoot.innerHTML=''};closeBtn.onclick=close;bg.onclick=e=>{if(e.target===bg)close()};document.addEventListener('keydown',key);onOpen?.(close);setTimeout(()=>{const cancel=modalRoot.querySelector('[id$="cancel"],#gc,#tc,#pca');(cancel||modalRoot.querySelector('input,textarea,select,button'))?.focus()},0)}

async function record(btn,status,audioPreview,deleteAudio){
  if(recorder&&recorder.state==='recording'){recorder.stop();return}

}
